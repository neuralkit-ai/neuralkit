[package]
name = "neuralkit"
version = "0.1.0"
edition = "2024"
description = "The terminal client for the Neuralkit platform: real-time EEG acquisition, streaming and visualization — in one Rust binary"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neuralkit-ai/neuralkit"
readme = "README.md"
keywords = ["QML"]
categories = ["science::neuroscience"]
authors = ["R. <r@neuralkit.ai>"]

# `phaze native dev` / `build` / `bundle` / `info` read this table (`phaze native info` prints it
# resolved). `app` is the phaze app the shell embeds; `dev-url` is what `dev` waits for and bakes
# into a dev build (build.rs); `run-args` is what `cargo run --` needs to open the panel.
[package.metadata.native]
app = "app"
dev-url = "http://localhost:5180"   # app/vite.config.ts binds it strictly; 5173 is -web's
# Vite named directly: the app's scripts are named for the shell they run (`wry:dev`,
# `wry:build`), and a bare `dev` / `build` would be ambiguous once a second shell exists.
dev-command = "pnpm exec vite"
# `--app`: the client, the app's worker (built, never deployed — the panel has no server) and the
# shipped `dist/app`, the directory `include_dir!` embeds.
build-command = "pnpm exec vite build --app"
run-args = ["tray"]

# The macOS bundle. Its name, file name and identifier are the app's — `native({ name, fileName,
# identifier })` in app/vite.config.ts, written by the app's build to app/dist/app/phaze-app.json.
# What stays here is how it is signed: `team` and the app's identifier must match the App ID the
# profiles were issued for — `bundle` refuses to sign unless the entitlements claim exactly
# `<team>.<identifier>`. Bundles land in target/<profile>/bundle/macos/ (Tauri's layout).
[package.metadata.native.macos]
team = "SBG7YFF24U"
info-plist = "release/macos/Info.plist"
entitlements = "release/macos/neuralkit.entitlements"

# The signing pairs — an identity and the provisioning profile it was issued with. Neither is a
# secret (the identity is a certificate's name; the private key stays in the keychain). Another
# Mac overrides with APPLE_SIGNING_IDENTITY + PHAZE_NATIVE_PROFILE. The identity must be one the
# PROFILE lists (`security cms -D -i <profile>`, DeveloperCertificates): a valid cert the profile
# does not list still dies at launch — AMFI SIGKILL, exit 137, which reads exactly like "the
# entitlement does not work".
[package.metadata.native.macos.sign.dev]
identity = "Apple Development: Rohan Rehman (CBQ9TZC7T3)"
profile = "~/Downloads/Neuralkit_CLI_Dev.provisionprofile"

[package.metadata.native.macos.sign.release]
identity = "Developer ID Application: Neuralkit inc. (SBG7YFF24U)"
profile = "~/Downloads/Neuralkit_CLI_Developer_ID.provisionprofile"

[features]
# THE EMBEDDED PANEL IS A FEATURE, ON BY DEFAULT — Tauri's `custom-protocol` model. A build
# WITHOUT it is a DEV build: `include_dir!` is skipped (so `app/dist` need not exist), and the
# webview loads the Vite dev server URL that build.rs bakes in from PHAZE_NATIVE_DEV_URL — which
# is what `phaze native dev` (app/package.json `wry:dev`) sets, with `cargo run
# --no-default-features`. A release binary therefore has no dev URL to be pointed at, and a bare
# `cargo run` still embeds, as it always did.
default = ["embed"]
embed = []
# The panel's brotli decoder — see `brotli-decompressor` under [dependencies].
panel-brotli = ["dep:brotli-decompressor"]
# A real Web Inspector on the panel (right-click → Inspect) in a RELEASE build: wry enables
# devtools in debug builds by itself but needs its `devtools` feature for release, which calls
# private WebKit API — never in the shipped binary, hence a feature and not a default.
panel-devtools = ["wry/devtools"]

[dependencies]
# Ingest — NeuroSky serial headset + CLI args.
serialport = "4.3.0"
clap = { version = "4.4", features = ["derive"] }
# Signal processing — FFT band extraction (signal_processing.rs).
realfft = "3.3"
# TUI — crossterm's `event-stream` feature DROPPED vs neurosky-rs: only the
# synchronous event::poll / event::read are used, never the async EventStream.
ratatui = "0.30.0"
crossterm = "0.28.1"
# Async runtime — trimmed from `full` to the features actually used
# (#[tokio::main], spawn, select, sync::mpsc, time::{sleep,timeout},
# net::TcpStream). Drops fs/process/signal/io-std/… from the build.
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-std", "io-util"] }
# MoQ pub/sub over QUIC (streaming.rs) — our own client on Cloudflare's own
# moq-transport/moq-native-ietf (../phaze/crates/phaze-moq, a sibling repo).
# Direct subscribe-by-name only, matching what Cloudflare's production relay
# actually speaks (it has no announce/discovery at all).
phaze-moq = { path = "../phaze/crates/phaze-moq" }
bytes = "1"
anyhow = "1.0"
url = "2.5"
# `neuralkit auth login` (the device flow): held HTTPS SSE + terminal QR. The stream is
# plain over TLS (no per-frame seal) — the session channel's crypto is phaze-crypto, below —
# so a distributed `neuralkit auth login` needs nothing but the URL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
qrcode = "0.14"
# Interactive session (auth login → REPL, session.rs): ONE WebSocket to the
# ---Cli.session dispatcher stream. The fence declares sign:'ed25519' +
# encrypt:'aes-gcm-256', so each frame is {e,iv} → AES-GCM → {v,s} → ed25519.
# phaze-crypto (no features: aes + ed25519 only, no lattice tree) reads that wire
# with the same primitives the fence's server half uses.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
phaze-crypto = { path = "../phaze/crates/phaze-crypto", features = ["pqc-kem"] }
# The authenticator half — producing WebAuthn assertions natively (passkey.rs). Same crate the
# SERVER verifies with, which is the point: the bytes this CLI makes are bytes it already reads.
phaze-auth = { path = "../phaze/crates/phaze-auth" }

# ALREADY IN THE BUILD — `tao` resolves all three for the tray, so naming them here downloads
# nothing and compiles nothing new; it only makes what the panel uses reachable by name. The
# feature list is explicit because objc2-app-kit gates every class behind one.
# Session expiry is stored as an absolute ms timestamp and shown in the DEVICE's local
# time, which needs a tz-aware conversion. Already in the tree transitively, so making it
# direct costs no extra build; `clock` is the feature that provides `Local`.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
# TLS provider selection ONLY. quinn pulls BOTH aws-lc-rs and ring into the graph,
# which makes rustls' feature-detected process default ambiguous (it panics on
# first use); `ring` is the one moq-native-ietf installs, so both TLS paths in
# this binary end up on one provider. See session.rs's install_default call.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
getrandom = "0.2"
# Logging → neuralkit_debug.log (the TUI owns the terminal).
tracing = "0.1"
tracing-subscriber = "0.3"
# Wire codecs — protobuf NeuroPacket (primary track "0" + TAK placeholder),
# FlatBuffers NeuroFrame (browser-facing eeg track).
prost = "0.13"
flatbuffers = "25"
# `tui` on: --foreground shows the SAME live relay dashboard the standalone binary
# draws (lib-exported for exactly this embedder). The icon path stays headless.
phaze-relay = { version = "0.1.0", path = "../phaze/crates/phaze-relay", default-features = false, features = ["tui"] }
# DROPPED vs neurosky-rs: serde (no direct usage — leftover).
# DROPPED vs the old placeholder: bollard (Docker client), color-eyre,
# itertools, palette (all chart-demo-only cruft).

[build-dependencies]
prost-build = "0.13"

[profile.release]
codegen-units = 1 # Allows compiler to perform better optimization.
lto = true        # Enables Link-time Optimization.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
strip = true      # Ensures debug symbols are removed.

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
tao = "0.36.0"
tray-icon = "0.24.2"
# ALREADY IN THE BUILD — `tao` resolves all three for the tray, so naming them here downloads and
# compiles nothing new; it only makes what the panel uses reachable by name. The feature list is
# explicit because objc2-app-kit gates every class behind one.
objc2 = "0.6"
objc2-foundation = "0.3"
# THE PANEL'S RENDERER — see panel.rs `web_card`. Wry is the only genuinely NEW dependency
# here (unlike the objc2 family, which tao already resolved); it embeds the OS's own WKWebView
# rather than shipping a browser, and raw-window-handle is how it is told which NSView to sit in.
# `transparent` IS NOT A DEFAULT FEATURE, and without it `with_transparent(true)` compiles and
# does nothing — the `drawsBackground = NO` that stops WKWebView painting white is behind that
# cfg. A webview that paints its own background hides the Liquid Glass the panel exists to show.
wry = { version = "0.53", features = ["transparent"] }
# Embeds app/dist so the custom protocol can serve fabric's LAZY chunks. `with_html` could
# not: a null-origin page has nothing for `import("./sdfEngine-….js")` to resolve against.
include_dir = "0.7"
# ALREADY IN THE BUILD — `tray-icon` → `png` links flate2 (miniz_oxide backend); naming it here
# adds no code. It decodes the panel's gzip'd assets in the custom-protocol handler: WebKit does
# not decode a scheme-handler body (measured — a `Content-Encoding: br` response reached the
# parser as raw bytes), so the shell decodes and serves raw.
flate2 = "1"
# NOT otherwise in the build. The decode-only half of the brotli crate Tauri embeds with; it
# carries brotli's 122,784-byte static dictionary, which is why it is a feature and not a default:
# pair `--features panel-brotli` with `native({ compress: 'brotli' })` in app/vite.config.ts,
# and measure the binary — the dictionary is a fixed cost, the tighter packing scales with assets.
brotli-decompressor = { version = "5", optional = true, default-features = false, features = ["std"] }
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWindow", "NSPanel", "NSResponder", "NSView", "NSGraphics",
    "NSControl", "NSButton", "NSCell",
    "NSImage", "NSColor", "NSGlassEffectView",
    "NSVisualEffectView", "NSBezierPath",
] }

[dev-dependencies]
# SPIKE ONLY (dev-dependency — never in the shipped binary): proves fabric's own WGSL
# compute shader runs natively through Rust wgpu on Metal.
wgpu = "30"
pollster = "0.4"

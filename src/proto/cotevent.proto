syntax = "proto3";

package atakmap.commoncommo.protobuf.v1;

import "cotdetail.proto";

message CotEvent {
    string type = 1;
    string access = 2;
    string qos = 3;
    string opexto = 4;
    string uid = 5;
    uint64 sendTime = 6;
    uint64 startTime = 7;
    uint64 staleTime = 8;
    double how = 9;
    double lat = 10;
    double lon = 11;
    double ce = 12;
    double le = 13;
    double hae = 14;
    CotDetail detail = 15;
}

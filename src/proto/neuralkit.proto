syntax = "proto3";

package neuralkit;

message NeuroPacket {
    uint64 timestamp_ms = 1;
    float delta = 2;
    float theta = 3;
    float alpha = 4;
    float beta = 5;
    float gamma = 6;
    uint64 attention = 7;
    uint64 meditation = 8;
    uint32 poor_signal = 9;
    repeated int32 raw_data = 10;
    bool has_attention_update = 11;
    bool has_meditation_update = 12;
}
